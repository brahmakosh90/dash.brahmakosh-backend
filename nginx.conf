# /etc/nginx/sites-available/brahmakosh
# Deploy: sudo cp nginx.conf /etc/nginx/sites-available/brahmakosh
#         sudo nginx -t && sudo systemctl reload nginx

# ── Connection tuning ────────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic ────────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        image/svg+xml;

    # ── SSL global settings ──────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # SSL session cache — avoids full handshake on repeat connections (fixes 696ms SSL time)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — client doesn't need to contact CA separately
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name api.brahmakosh.com;
        return 301  https://$host$request_uri;
    }

    # ── Main HTTPS server ────────────────────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;                          # HTTP/2 (fixes HTTP/1.1 issue)
        server_name api.brahmakosh.com;

        ssl_certificate     /etc/letsencrypt/live/api.brahmakosh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.brahmakosh.com/privkey.pem;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;

        # ── Proxy to Node.js ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # ── Cache-Control per route ──────────────────────────────────────
            # Static content (puja, meditations etc.) — cache 10 min in browser
            location ~* ^/api/(puja-padhati|meditations|chantings|prathanas|spiritual-activities|spiritual-clips|shlokas|chapters|live-avatars|brahm-avatars|swapna-decoder|shiv-puran|ramayana|durga-saptashati|puja-padhati|sankalp|leaderboard|expert-categories|experts|testimonials|reviews|sponsors|founder-messages|brand-assets)$ {
                proxy_pass http://127.0.0.1:5000;
                add_header Cache-Control "public, max-age=600, stale-while-revalidate=60";
            }

            # Auth / user-specific — never cache
            location ~* ^/api/(auth|mobile/user|spiritual-stats|karma-points|reward-redemptions|user-sankalp|notifications|chat|voice)/ {
                proxy_pass http://127.0.0.1:5000;
                add_header Cache-Control "no-store";
            }
        }

        # WebSocket support
        location /socket.io/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
